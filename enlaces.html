<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis enlaces</title>
<meta name="description" content="Todos mis enlaces: la guía para armar tu canal con IA y mis redes.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="config.js"></script>
</head>
<body>
<main class="enlaces">
  <div class="avatar"><img src="img/personaje.jpg" alt="El personaje dorado del canal"></div>
  <h1 class="monumento" data-canal>Mi canal</h1>
  <p class="ojo"><i class="punto vivo"></i>Prehistoria y "¿Qué pasaría si…?" hechos con IA</p>
  <nav class="lista" aria-label="Enlaces">
    <a class="pill brasa" data-enlace="comprar" href="index.html"><span class="mas" aria-hidden="true">+</span>Guía: cómo armé este canal con IA<span class="fin">USD <span data-precio>15</span></span></a>
    <a class="pill" href="index.html"><span class="mas" aria-hidden="true">+</span>Ver qué incluye la guía<span class="fin">Info</span></a>
    <a class="pill" data-enlace="youtube" href="#" target="_blank" rel="noopener"><span class="mas" aria-hidden="true">+</span>YouTube<span class="fin">Videos largos</span></a>
    <a class="pill" data-enlace="tiktok" href="#" target="_blank" rel="noopener"><span class="mas" aria-hidden="true">+</span>TikTok<span class="fin">Shorts</span></a>
    <a class="pill" data-enlace="instagram" href="#" target="_blank" rel="noopener"><span class="mas" aria-hidden="true">+</span>Instagram<span class="fin">Reels</span></a>
    <a class="pill" data-enlace="facebook" href="#" target="_blank" rel="noopener"><span class="mas" aria-hidden="true">+</span>Facebook<span class="fin">Página</span></a>
  </nav>
  <p class="ojo"><i class="punto gris"></i>Todo hecho con IA · Argentina</p>
</main>
<script>
(function () {
  var c = window.CONFIG || {};
  document.querySelectorAll('[data-enlace]').forEach(function (a) {
    var k = a.getAttribute('data-enlace'), u = c[k];
    if (u && u.indexOf('XXXX') === -1 && u.indexOf('tucanal') === -1) a.href = u;
  });
  if (c.canal && c.canal !== '{CANAL}') document.querySelectorAll('[data-canal]').forEach(function (e) { e.textContent = c.canal; });
  if (c.precio) document.querySelectorAll('[data-precio]').forEach(function (e) { e.textContent = c.precio; });
})();
</script>
</body>
</html>
