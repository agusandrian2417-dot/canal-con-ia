<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=Instrument+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
  html, body { width: 1200px; height: 1200px; overflow: hidden; }
  .portada { position: relative; width: 1200px; height: 1200px; background: #000; display: grid; grid-template-columns: 1fr 440px; }
  .texto { padding: 84px 0 84px 84px; display: flex; flex-direction: column; justify-content: space-between; }
  .texto h1 { font-size: 168px; }
  .texto .cuerpo { font-size: 26px; max-width: 24em; }
  .texto .ojo { font-size: 18px; }
  .pie { display: flex; gap: 10px; }
  .pie .etiq { font-size: 16px; padding: 8px 14px; }
  .lado { position: relative; overflow: hidden; border-left: 1px solid var(--grafito); }
  .lado img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
  .lado::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #000 0, rgba(0,0,0,0) 35%); }
  .marca { position: absolute; left: 84px; bottom: 84px; display: flex; align-items: center; gap: 12px; }
  .marca i { width: 14px; height: 14px; border-radius: 50%; background: var(--brasa); }
  .marca span { font-family: var(--fd); font-weight: 700; font-size: 34px; letter-spacing: .02em; color: #fff; }
</style>
</head>
<body>
<div class="portada">
  <div class="texto">
    <p class="ojo"><i class="punto"></i>Guía práctica · PDF + 50 prompts</p>
    <div>
      <h1 class="monumento">Tu canal con IA, de cero a monetizar.</h1>
      <p class="cuerpo" style="margin-top:28px">El método completo para armar un canal de videos con inteligencia artificial, <b>sin mostrar la cara</b>.</p>
    </div>
    <div class="pie"><span class="etiq">8 módulos</span><span class="etiq">30 ideas</span><span class="etiq">Apps desde 0 USD</span></div>
  </div>
  <div class="lado"><img src="img/v3.jpg" alt=""></div>
</div>
</body>
</html>
